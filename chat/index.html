<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes AI Assistant | Clinical Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Advanced DevTool Blocker -->
    <script src="https://cdn.jsdelivr.net/npm/disable-devtool"></script>
    <style>
        :root {
            --bg-color: #fdfdfd;
            --sidebar-bg: #f7f7f8;
            --text-color: #202123;
            --border-color: #e5e5e5;
            --input-bg: #ffffff;
            --chat-bubble-user: #ffffff;
            --chat-bubble-ai: #f7f7f8;
            --accent-color: #10a37f;
            --secondary-text: #6e6e80;
            --card-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #212121;
            --sidebar-bg: #171717;
            --text-color: #ececf1;
            --border-color: #444654;
            --input-bg: #40414f;
            --chat-bubble-user: #343541;
            --chat-bubble-ai: #444654;
            --accent-color: #10a37f;
            --secondary-text: #acacbe;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 40%;
            height: 100%;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
        }

        .main-chat {
            width: 60%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .upload-card,
        .data-card {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .drop-zone {
            width: 100%;
            height: 150px;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            gap: 8px;
            color: var(--secondary-text);
            background: rgba(16, 163, 127, 0.02);
            position: relative;
            overflow: hidden;
        }

        .drop-zone img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--secondary-text);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-group input {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
            font-size: 0.95rem;
        }

        .input-group input:invalid {
            border-color: #ff4d4d;
        }

        .predict-btn {
            margin-top: 15px;
            padding: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .predict-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: var(--bg-color);
            padding: 30px;
            border-radius: 16px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal h3 {
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .modal p {
            color: var(--secondary-text);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Chat */
        .chat-header {
            padding: 15px 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .message {
            padding: 20px 25px;
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .message.ai {
            background: var(--chat-bubble-ai);
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .avatar.ai {
            background: var(--accent-color);
            color: white;
        }

        .avatar.user {
            background: #5436da;
            color: white;
        }

        .msg-text {
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .chat-input-area {
            padding: 25px;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            padding: 10px 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            resize: none;
            font-family: inherit;
            padding: 5px 0;
            max-height: 150px;
        }

        .send-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-icon {
            cursor: pointer;
            color: var(--accent-color);
            margin-left: 5px;
            opacity: 0.7;
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }

            .sidebar,
            .main-chat {
                width: 100%;
                height: 50%;
            }
        }
    </style>
</head>

<body data-theme="dark">
    <!-- Info Modal -->
    <div id="modal-overlay" onclick="closeInfo()">
        <div class="modal" onclick="event.stopPropagation()">
            <h3 id="info-title">Title</h3>
            <p id="info-body">Description...</p>
            <button class="predict-btn" onclick="closeInfo()">Đã hiểu</button>
        </div>
    </div>

    <div class="container">
        <!-- Sidebar: Inputs -->
        <div class="sidebar">
            <h3 class="section-title"><i class="fas fa-eye"></i> Iris Image Analysis</h3>
            <div class="upload-card">
                <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-upload fa-2x"></i>
                    <span id="label">Click to upload iris photo</span>
                    <img id="preview" alt="Preview">
                </div>
                <input type="file" id="fileInput" hidden accept="image/*">
                <button class="predict-btn" id="analyzeIrisBtn" onclick="processIris()">Analyze Iris</button>
            </div>

            <h3 class="section-title"><i class="fas fa-list-alt"></i> Clinical Biomarkers</h3>
            <div class="data-card">
                <div class="input-grid" id="biomarkerGrid">
                    <!-- Dynamic Fields -->
                </div>
                <button class="predict-btn" id="analyzeDataBtn" onclick="processBiomarkers()">Predict Status</button>
            </div>
        </div>

        <!-- Main: Chat -->
        <div class="main-chat">
            <div class="chat-header">
                <span style="font-weight: 600; font-size: 0.9rem;">Diagnostic Assistant v1.0</span>
                <button onclick="toggleTheme()"
                    style="background:none; border:none; cursor:pointer; color:var(--text-color);">
                    <i class="fas fa-adjust"></i>
                </button>
            </div>
            <div class="chat-messages" id="chatBox"></div>
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <textarea id="promptInput" rows="1" placeholder="Nhập câu hỏi tại đây..."></textarea>
                    <button class="send-btn" onclick="handleChat()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="resizeCanvas" width="256" height="256" style="display:none;"></canvas>

    <script>
        // 1. SECURITY: Disable DevTools Library
        DisableDevtool({
            ondevtoolopen: (type) => {
                window.location.href = "about:blank";
            },
        });

        const API_BASE = "https://db57-109-237-69-254.ngrok-free.app";

        const schema = {
            "Pregnancies": { min: 0, max: 20, desc: "Số lần mang thai của bệnh nhân." },
            "Glucose": { min: 40, max: 300, desc: "Nồng độ đường trong máu (mg/dL)." },
            "BloodPressure": { min: 40, max: 140, desc: "Huyết áp tâm trương (mm Hg)." },
            "SkinThickness": { min: 5, max: 100, desc: "Độ dày nếp gấp da cơ tam đầu (mm)." },
            "Insulin": { min: 14, max: 900, desc: "Nồng độ insulin huyết thanh (mu U/ml)." },
            "BMI": { min: 10, max: 60, desc: "Chỉ số khối cơ thể (Cân nặng/Chiều cao²)." },
            "DiabetesPedigreeFunction": { min: 0.05, max: 2.5, desc: "Hệ số di truyền bệnh tiểu đường." },
            "Age": { min: 1, max: 120, desc: "Tuổi của bệnh nhân (năm)." }
        };

        // 2. BUILD UI
        const grid = document.getElementById('biomarkerGrid');
        Object.keys(schema).forEach(key => {
            const group = document.createElement('div');
            group.className = 'input-group';
            group.innerHTML = `
                <label>${key} <i class="fas fa-info-circle info-icon" onclick="showInfo('${key}')"></i></label>
                <input type="number" step="any" id="in-${key}" placeholder="0" onchange="validateInput(this, '${key}')">
            `;
            grid.appendChild(group);
        });

        const chatBox = document.getElementById('chatBox');
        const promptInput = document.getElementById('promptInput');

        window.onload = () => {
            addMessage('ai', "Xin chào! Tôi là trợ lý AI chuyên về chẩn đoán tiểu đường. Tôi có thể giúp bạn phân tích ảnh mống mắt hoặc các chỉ số sinh học để đánh giá rủi ro sức khỏe. Hãy bắt đầu bằng cách tải ảnh lên hoặc nhập dữ liệu ở bảng bên trái.");
        };

        // 3. INPUT CONTROL & SECURITY
        function sanitize(str) {
            return str.replace(/[<>/{}[\]]/g, '').trim();
        }

        function validateInput(el, key) {
            const val = parseFloat(el.value);
            const { min, max } = schema[key];
            if (val < min || val > max) {
                el.style.borderColor = "#ff4d4d";
                console.warn(`Outlier detected for ${key}: ${val}`);
            } else {
                el.style.borderColor = "var(--border-color)";
            }
        }

        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleChat();
            }
        });

        // 4. IMAGE PROCESSING (AUTORESIZE 256x256)
        const fileIn = document.getElementById('fileInput');
        fileIn.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('resizeCanvas');
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 256, 256);
                    const preview = document.getElementById('preview');
                    preview.src = canvas.toDataURL("image/jpeg");
                    preview.style.display = 'block';
                    document.getElementById('label').style.display = 'none';
                    document.querySelector('.drop-zone i').style.display = 'none';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        async function processIris() {
            const canvas = document.getElementById('resizeCanvas');
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));
            if (!blob) { alert("Vui lòng chọn ảnh trước."); return; }

            addMessage('user', "[Ảnh mống mắt đã tải lên]");
            setLoading('analyzeIrisBtn', true);

            const fd = new FormData();
            fd.append('file', blob, 'iris_256.jpg');

            try {
                const res = await fetch(`${API_BASE}/predict_image`, { method: 'POST', body: fd });
                const data = await res.json();
                const result = data.disease === 1 ? "CÓ DẤU HIỆU BỆNH" : "BÌNH THƯỜNG (Âm tính)";
                addMessage('ai', `Kết quả phân tích mống mắt: **${result}**.`);
            } catch (err) {
                addMessage('ai', "Lỗi: Không thể kết nối tới máy chủ phân tích mống mắt.");
            } finally {
                setLoading('analyzeIrisBtn', false);
            }
        }

        async function processBiomarkers() {
            const payload = {};
            let hasOutlier = false;

            Object.keys(schema).forEach(key => {
                const val = parseFloat(document.getElementById(`in-${key}`).value) || 0;
                if (val < schema[key].min || val > schema[key].max) hasOutlier = true;
                payload[key] = val;
            });

            if (hasOutlier) {
                if (!confirm("Một số chỉ số có vẻ bất thường (outlier). Bạn vẫn muốn tiếp tục?")) return;
            }

            addMessage('user', "Phân tích các chỉ số sức khỏe của tôi.");
            setLoading('analyzeDataBtn', true);

            try {
                const res = await fetch(`${API_BASE}/predict_data`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                const risk = data.disease === 1 ? "NGUY CƠ CAO" : "NGUY CƠ THẤP (Ổn định)";
                addMessage('ai', `Dựa trên dữ liệu lâm sàng: **${risk}**.`);
            } catch (err) {
                addMessage('ai', "Lỗi: Hệ thống chẩn đoán đang bận hoặc gặp sự cố kết nối.");
            } finally {
                setLoading('analyzeDataBtn', false);
            }
        }

        // 5. CHAT LOGIC (Placeholder for user logic)
        function handleChat() {
            const text = sanitize(promptInput.value);
            if (!text) return;
            addMessage('user', text);
            promptInput.value = '';
            promptInput.style.height = 'auto';

            // Placeholder logic: AI will acknowledge but stay silent until user implements backend
            setTimeout(() => {
                addMessage('ai', "Tôi đã nhận được thông tin. Hiện tại tôi đang tập trung vào chẩn đoán lâm sàng, bạn có thể xem kết quả phân tích ở trên.");
            }, 600);
        }

        // UTILS
        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<div class="avatar ${role}">${role === 'ai' ? 'AI' : 'U'}</div><div class="msg-text">${text}</div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setLoading(id, state) {
            const btn = document.getElementById(id);
            btn.disabled = state;
            btn.innerHTML = state ? '<i class="fas fa-spinner fa-spin"></i> Processing...' : (id === 'analyzeIrisBtn' ? 'Analyze Iris' : 'Predict Status');
        }

        function showInfo(key) {
            document.getElementById('info-title').innerText = key;
            document.getElementById('info-body').innerText = schema[key].desc;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeInfo() { document.getElementById('modal-overlay').style.display = 'none'; }

        function toggleTheme() {
            const b = document.body;
            b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        function handleResize() { /* Dynamic adjustments if needed */ }
    </script>
</body>

</html>
