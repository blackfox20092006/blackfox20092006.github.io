<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes AI Assistant | Secure Diagnostics</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #fdfdfd;
            --sidebar-bg: #f7f7f8;
            --text-color: #202123;
            --border-color: #e5e5e5;
            --input-bg: #ffffff;
            --chat-bubble-user: #ffffff;
            --chat-bubble-ai: #f7f7f8;
            --accent-color: #10a37f;
            --secondary-text: #6e6e80;
            --card-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #212121;
            --sidebar-bg: #171717;
            --text-color: #ececf1;
            --border-color: #444654;
            --input-bg: #40414f;
            --chat-bubble-user: #343541;
            --chat-bubble-ai: #444654;
            --accent-color: #10a37f;
            --secondary-text: #acacbe;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease;
            user-select: none; /* Prevent selection as part of security */
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        #bot-blocker, #f12-blocker {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #ff0000;
            z-index: 99999;
            flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; font-size: 1.5rem;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 50%; height: 100%;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
            padding: 32px; overflow-y: auto;
        }

        .main-chat {
            width: 50%; height: 100%;
            display: flex; flex-direction: column;
            position: relative;
        }

        .section-header {
            margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .section-title {
            font-size: 1.25rem; font-weight: 600;
            display: flex; align-items: center; gap: 12px;
            color: var(--accent-color);
        }

        .upload-section, .data-section {
            background: var(--bg-color);
            padding: 24px; border-radius: 16px;
            box-shadow: var(--card-shadow);
            margin-bottom: 24px; border: 1px solid var(--border-color);
        }

        .drop-zone {
            width: 100%; height: 180px;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; gap: 12px;
            color: var(--secondary-text);
            position: relative; background: rgba(16, 163, 127, 0.02);
            overflow: hidden;
        }

        .drop-zone img {
            max-width: 100%; max-height: 100%;
            object-fit: contain; display: none; border-radius: 8px;
        }

        /* Loading Bar */
        .progress-container {
            width: 100%; height: 6px;
            background: var(--border-color);
            border-radius: 3px; margin-top: 15px;
            display: none; overflow: hidden;
        }
        .progress-bar {
            width: 0%; height: 100%;
            background: var(--accent-color);
            transition: width 0.3s ease;
        }

        .input-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 20px; margin-top: 16px;
        }

        .input-group {
            display: flex; flex-direction: column; gap: 8px;
        }

        .input-group label {
            font-size: 0.9rem; font-weight: 500;
            color: var(--secondary-text);
            display: flex; align-items: center; gap: 6px;
        }

        .info-btn {
            cursor: pointer; color: var(--accent-color);
            font-size: 0.8rem; opacity: 0.7;
            transition: opacity 0.2s;
        }
        .info-btn:hover { opacity: 1; }

        .input-group input {
            padding: 12px 16px; border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--input-bg); color: var(--text-color);
            outline: none; font-size: 1rem;
        }

        .predict-btn {
            margin-top: 20px; padding: 14px;
            background: var(--accent-color); color: white;
            border: none; border-radius: 12px;
            font-weight: 600; cursor: pointer;
            width: 100%; font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(16, 163, 127, 0.2);
            transition: all 0.2s;
        }
        .predict-btn:disabled {
            background: #ccc; cursor: not-allowed; transform: none !important;
        }
        .predict-btn:hover:not(:disabled) { background: #0e8c6d; transform: translateY(-2px); }

        /* Description Modal */
        #info-modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000;
            backdrop-filter: blur(4px);
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--bg-color);
            padding: 32px; border-radius: 20px;
            max-width: 500px; width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center; animation: modalPop 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-content h3 { color: var(--accent-color); margin-bottom: 16px; }
        .modal-content p { line-height: 1.6; color: var(--text-color); margin-bottom: 24px; }
        .close-modal {
            background: var(--accent-color); color: white;
            border: none; padding: 10px 24px; border-radius: 8px;
            cursor: pointer; font-weight: 600;
        }

        /* Chat Styling */
        .chat-header {
            padding: 16px 24px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-messages { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
        .message { padding: 24px 32px; display: flex; gap: 24px; border-bottom: 1px solid var(--border-color); animation: slideIn 0.4s forwards; opacity: 0; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .message.ai { background-color: var(--chat-bubble-ai); }
        .avatar { width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 600; }
        .avatar.user { background: #5436da; color: white; }
        .avatar.ai { background: var(--accent-color); color: white; }

        .chat-input-container { padding: 24px 32px 40px; background: linear-gradient(transparent, var(--bg-color)); }
        .chat-input-wrapper { max-width: 800px; margin: 0 auto; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 16px; display: flex; align-items: flex-end; padding: 12px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .chat-input-wrapper textarea { flex: 1; background: transparent; border: none; outline: none; color: var(--text-color); padding: 10px 0; font-size: 1rem; resize: none; max-height: 200px; }
        .send-btn { background: var(--accent-color); color: white; border: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; margin-left: 12px; display: flex; align-items: center; justify-content: center; }

        @media (max-width: 992px) { .container { flex-direction: column; } .sidebar, .main-chat { width: 100%; height: 50%; } }
    </style>
</head>

<body data-theme="dark">
    <div id="bot-blocker">
        <h1>SECURITY ALERT</h1>
        <p>Automation tools (Selenium/WebDriver) detected. Access Denied.</p>
    </div>
    <div id="f12-blocker">
        <h1>ACCESS RESTRICTED</h1>
        <p>Developer tools are disabled on this diagnostic platform.</p>
    </div>

    <div id="info-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modal-title">Field Label</h3>
            <p id="modal-desc">Detailed description goes here...</p>
            <button class="close-modal" onclick="closeModal()">Đã hiểu</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="section-header">
                <h3 class="section-title"><i class="fas fa-eye"></i> Iris Diagnostic</h3>
            </div>
            <div class="upload-section">
                <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-camera-retro fa-3x"></i>
                    <span id="upload-label">Chọn ảnh mống mắt (Max 440KB)</span>
                    <img id="preview" alt="Preview">
                </div>
                <input type="file" id="fileInput" hidden accept="image/*">
                
                <div class="progress-container" id="upload-progress">
                    <div class="progress-bar" id="progress-inner"></div>
                </div>
                
                <button class="predict-btn" id="iris-btn" onclick="predictIris()" disabled>
                    <i class="fas fa-search-plus"></i> Analyze Iris
                </button>
            </div>

            <div class="section-header">
                <h3 class="section-title"><i class="fas fa-heartbeat"></i> Health Factors</h3>
            </div>
            <div class="data-section" style="margin-bottom: 50px;">
                <div class="input-grid" id="inputGrid">
                    <!-- JS generated fields -->
                </div>
                <button class="predict-btn" id="data-btn" onclick="predictDiabetes()">
                    <i class="fas fa-stethoscope"></i> Predict Diabetes Status
                </button>
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <span style="font-weight: 600; opacity: 0.8;">Secure Health Assistant</span>
                <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-sun"></i></button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <textarea id="chatInput" placeholder="Hỏi AI về kết quả..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SECURITY SYSTEM ---
        (function() {
            // Anti-Automation
            if (window.navigator.webdriver || navigator.languages === "" || window.callPhantom || window._phantom) {
                document.getElementById('bot-blocker').style.display = 'flex';
                document.querySelector('.container').style.display = 'none';
            }

            // Anti-F12 / DevTools
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.onkeydown = function(e) {
                if (e.keyCode == 123 || 
                    (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
                    (e.ctrlKey && e.keyCode == 85)) {
                    document.getElementById('f12-blocker').style.display = 'flex';
                    document.querySelector('.container').style.display = 'none';
                    return false;
                }
            };
            
            // Console Flood Security
            setInterval(() => {
                var before = new Date().getTime();
                debugger;
                var after = new Date().getTime();
                if (after - before > 100) {
                    document.getElementById('f12-blocker').style.display = 'flex';
                    document.body.innerHTML = "Access Restricted";
                }
            }, 1000);
        })();

        // --- 2. CONFIG & DATA ---
        const API_BASE = "https://5b72-109-237-69-254.ngrok-free.app";
        const HF_TOKEN = ""; 
        const HF_MODEL = "mistralai/Mistral-7B-Instruct-v0.2";

        const fieldDetails = {
            "Pregnancies": "Số lần mang thai. Chỉ số này giúp đánh giá sự thay đổi nội tiết tố tích lũy có thể ảnh hưởng đến chuyển hóa glucose.",
            "Glucose": "Nồng độ glucose huyết tương sau 2 giờ trong nghiệm pháp dung nạp glucose đường uống. Đây là chỉ số quan trọng nhất để xác định sớm tiểu đường.",
            "BloodPressure": "Huyết áp tâm trương (mm Hg). Mối liên hệ giữa cao huyết áp và tiểu đường thường làm tăng rủi ro biến chứng tim mạch.",
            "SkinThickness": "Độ dày nếp gấp da cơ tam đầu (mm). Một chỉ số dùng để ước tính lượng mỡ cơ thể và phân phối mô mỡ.",
            "Insulin": "Nồng độ insulin huyết thanh sau 2 giờ (mu U/ml). Giúp xác định khả năng kháng insulin của cơ thể.",
            "BMI": "Chỉ số khối cơ thể (Cân nặng / Chiều cao²). BMI > 25 được coi là thừa cân, một yếu tố rủi ro hàng đầu của tiểu đường tuýp 2.",
            "DiabetesPedigreeFunction": "Chỉ số di truyền. Đánh giá mức độ rủi ro dựa trên lịch sử bệnh tiểu đường của người thân trong gia đình.",
            "Age": "Tuổi thọ tính theo năm. Rủi ro mắc tiểu đường thường tăng dần theo độ tuổi."
        };

        // --- 3. UI GENERATION ---
        const inputGrid = document.getElementById('inputGrid');
        Object.keys(fieldDetails).forEach(f => {
            const div = document.createElement('div');
            div.className = 'input-group';
            div.innerHTML = `
                <label>
                    ${f} 
                    <i class="fas fa-question-circle info-btn" onclick="openModal('${f}')"></i>
                </label>
                <input type="number" step="any" id="field-${f}" placeholder="0">
            `;
            inputGrid.appendChild(div);
        });

        function openModal(field) {
            document.getElementById('modal-title').innerText = field;
            document.getElementById('modal-desc').innerText = fieldDetails[field];
            document.getElementById('info-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('info-modal').style.display = 'none'; }

        // --- 4. CORE LOGIC ---
        const irisBtn = document.getElementById('iris-btn');
        const dataBtn = document.getElementById('data-btn');
        const progress = document.getElementById('upload-progress');
        const progressInner = document.getElementById('progress-inner');

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // Mock Upload Loading
                progress.style.display = 'block';
                irisBtn.disabled = true;
                let percent = 0;
                const interval = setInterval(() => {
                    percent += 10;
                    progressInner.style.width = percent + '%';
                    if (percent >= 100) {
                        clearInterval(interval);
                        irisBtn.disabled = false;
                        // Show Preview
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const preview = document.getElementById('preview');
                            preview.src = e.target.result;
                            preview.style.display = 'block';
                            document.getElementById('upload-label').style.display = 'none';
                            document.querySelector('.drop-zone i').style.display = 'none';
                        };
                        reader.readAsDataURL(file);
                    }
                }, 50);
            }
        });

        async function predictIris() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;

            setLoading(irisBtn, true);
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch(`${API_BASE}/predict_image`, { method: 'POST', body: formData });
                const data = await res.json();
                addMessage('ai', `Kết quả phân tích mống mắt: **${data.disease === 1 ? 'CÓ DẤU HIỆU BỆNH' : 'BÌNH THƯỜNG'}**.`);
            } catch (err) {
                addMessage('ai', "Lỗi: Không thể kết nối tới server phân tích ảnh.");
            } finally {
                setLoading(irisBtn, false);
            }
        }

        async function predictDiabetes() {
            const payload = {};
            Object.keys(fieldDetails).forEach(f => {
                const v = document.getElementById(`field-${f}`).value;
                payload[f] = v === "" ? 0 : parseFloat(v);
            });

            setLoading(dataBtn, true);
            try {
                const res = await fetch(`${API_BASE}/predict_data`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                addMessage('ai', `Đánh giá rủi ro: **${data.disease === 1 ? 'NGUY CƠ CAO' : 'BÌNH THƯỜNG'}**.`);
            } catch (err) {
                addMessage('ai', "Lỗi: Server y tế hiện không phản hồi.");
            } finally {
                setLoading(dataBtn, false);
            }
        }

        function setLoading(btn, isLoading) {
            btn.disabled = isLoading;
            btn.innerHTML = isLoading ? '<i class="fas fa-spinner fa-spin"></i> Processing...' : 
                           (btn.id === 'iris-btn' ? '<i class="fas fa-search-plus"></i> Analyze Iris' : '<i class="fas fa-stethoscope"></i> Predict Diabetes Status');
        }

        // --- 5. CHATBOT ACCESSORIES ---
        const msgBox = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<div class="avatar ${role}">${role==='user'?'U':'AI'}</div><div class="message-content">${text}</div>`;
            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        async function sendMessage() {
            const val = chatInput.value.trim();
            if(!val) return;
            addMessage('user', val);
            chatInput.value = '';
            // LLM Response logic... (simplified here)
            setTimeout(() => addMessage('ai', "Dựa trên các chỉ số bạn cung cấp, tôi khuyên bạn nên duy trì chế độ ăn ít đường và kiểm tra sức khỏe định kỳ."), 1000);
        }

        function toggleTheme() {
            const b = document.body;
            b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            document.querySelector('.theme-toggle i').className = b.getAttribute('data-theme') === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        window.onload = () => addMessage('ai', "Hệ thống bảo mật đã sẵn sàng. Chào mừng bạn.");
    </script>
</body>

</html>
