<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes AI Assistant | Iris Diagnostics</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #fdfdfd;
            --sidebar-bg: #f7f7f8;
            --text-color: #202123;
            --border-color: #e5e5e5;
            --input-bg: #ffffff;
            --chat-bubble-user: #ffffff;
            --chat-bubble-ai: #f7f7f8;
            --accent-color: #10a37f;
            --secondary-text: #6e6e80;
            --card-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #212121;
            --sidebar-bg: #171717;
            --text-color: #ececf1;
            --border-color: #444654;
            --input-bg: #40414f;
            --chat-bubble-user: #343541;
            --chat-bubble-ai: #444654;
            --accent-color: #10a37f;
            --secondary-text: #acacbe;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        #bot-blocker {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #ff0000;
            z-index: 10000;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 1.5rem;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 50%;
            height: 100%;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 32px;
            overflow-y: auto;
        }

        .main-chat {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .section-header {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--accent-color);
        }

        .upload-section {
            background: var(--bg-color);
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .drop-zone {
            width: 100%;
            height: 180px;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            gap: 12px;
            color: var(--secondary-text);
            transition: all 0.2s ease;
            position: relative;
            background: rgba(16, 163, 127, 0.02);
            overflow: hidden;
        }

        .drop-zone:hover {
            border-color: var(--accent-color);
            background: rgba(16, 163, 127, 0.08);
        }

        .drop-zone img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
            border-radius: 8px;
        }

        .data-section {
            background: var(--bg-color);
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--secondary-text);
        }

        .input-group input {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.1);
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            scroll-behavior: smooth;
        }

        .message {
            padding: 24px 32px;
            display: flex;
            gap: 24px;
            line-height: 1.7;
            border-bottom: 1px solid var(--border-color);
            animation: slideIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            opacity: 0;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.ai {
            background-color: var(--chat-bubble-ai);
        }

        .message.user {
            background-color: var(--chat-bubble-user);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .avatar.user {
            background: #5436da;
            color: white;
        }

        .avatar.ai {
            background: var(--accent-color);
            color: white;
        }

        .message-content {
            font-size: 1rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .typing {
            display: inline-flex;
            gap: 4px;
            padding: 8px 0;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--secondary-text);
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: 0;
                transform: scale(0.8);
            }

            40% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .chat-input-container {
            padding: 24px 32px 40px;
            background: linear-gradient(transparent, var(--bg-color));
        }

        .chat-input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            padding: 12px 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease;
        }

        .chat-input-wrapper:focus-within {
            transform: translateY(-2px);
            border-color: rgba(16, 163, 127, 0.5);
        }

        .chat-input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            padding: 10px 0;
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            max-height: 200px;
            line-height: 1.5;
        }

        .send-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            margin-left: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .send-btn:hover {
            filter: brightness(1.1);
            transform: scale(1.05);
        }

        .predict-btn {
            margin-top: 20px;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(16, 163, 127, 0.2);
        }

        .predict-btn:hover {
            background: #0e8c6d;
        }

        .theme-toggle {
            cursor: pointer;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
        }

        .error-hint {
            font-size: 0.75rem;
            color: #ff4d4d;
            margin-top: 8px;
            display: none;
        }

        @media (max-width: 992px) {
            .container {
                flex-direction: column;
            }

            .sidebar,
            .main-chat {
                width: 100%;
                height: 50%;
            }
        }
    </style>
</head>

<body data-theme="dark">
    <div id="bot-blocker">
        <h1>Banned</h1>
        <p>Automation detected. Access denied for security reasons.</p>
    </div>

    <div class="container">
        <!-- Input Sidebar -->
        <div class="sidebar">
            <div class="section-header">
                <h3 class="section-title"><i class="fas fa-eye"></i> Iris Diagnostic</h3>
            </div>
            <div class="upload-section">
                <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-camera-retro fa-3x"></i>
                    <span id="upload-label">Cài ảnh mống mắt (Max 440KB)</span>
                    <img id="preview" alt="Preview">
                </div>
                <input type="file" id="fileInput" hidden accept="image/*">
                <div id="img-error" class="error-hint"></div>
                <button class="predict-btn" onclick="predictIris()"><i class="fas fa-search-plus"></i> Analyze
                    Iris</button>
            </div>

            <div class="section-header">
                <h3 class="section-title"><i class="fas fa-heartbeat"></i> Health Factors</h3>
            </div>
            <div class="data-section" style="margin-bottom: 50px;">
                <div class="input-grid" id="inputGrid">
                    <!-- JS generated fields -->
                </div>
                <div id="data-error" class="error-hint"></div>
                <button class="predict-btn" onclick="predictDiabetes()"><i class="fas fa-stethoscope"></i> Predict
                    Diabetes Status</button>
            </div>
        </div>

        <!-- Chat Main -->
        <div class="main-chat">
            <div class="chat-header">
                <span style="font-weight: 600; opacity: 0.8;">Smart Diabetes Assistant</span>
                <button class="theme-toggle" onclick="toggleTheme()">
                    <i class="fas fa-sun"></i>
                </button>
            </div>

            <div class="chat-messages" id="chatMessages">
                <!-- Messages JS -->
            </div>

            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <textarea id="chatInput" placeholder="Hỏi AI về sức khỏe..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i
                            class="fas fa-paper-plane"></i></button>
                </div>
                <p style="font-size: 0.7rem; text-align: center; margin-top: 10px; color: var(--secondary-text);">
                    Powered by Open Source LLM via HF Inference API</p>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const API_BASE = "https://5b72-109-237-69-254.ngrok-free.app";
        const HF_TOKEN = "";
        const HF_MODEL = "mistralai/Mistral-7B-Instruct-v0.2";

        // Security Check
        (function () {
            if (window.navigator.webdriver || navigator.languages === "" || window.callPhantom || window._phantom) {
                document.getElementById('bot-blocker').style.display = 'flex';
                document.querySelector('.container').style.display = 'none';
            }
        })();

        const fields = ["Pregnancies", "Glucose", "BloodPressure", "SkinThickness", "Insulin", "BMI", "DiabetesPedigreeFunction", "Age"];

        const inputGrid = document.getElementById('inputGrid');
        fields.forEach(f => {
            const div = document.createElement('div');
            div.className = 'input-group';
            div.innerHTML = `<label>${f}</label><input type="number" step="any" id="field-${f}" placeholder="0">`;
            inputGrid.appendChild(div);
        });

        const msgBox = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="avatar ${role}">${role === 'user' ? 'U' : 'AI'}</div>
                <div class="message-content">${text}</div>
            `;
            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        window.onload = () => {
            addMessage('ai', "Chào bạn! Tôi là trợ lý AI y tế. Tôi có thể chẩn đoán tiểu đường qua mống mắt hoặc chỉ số sinh học. Hãy nhập dữ liệu bên trái hoặc hỏi tôi bất cứ điều gì về sức khỏe :)");

            // Cảnh báo nếu chạy local file
            if (window.location.protocol === 'file:') {
                console.warn("Lưu ý: Bạn đang chạy file trực tiếp. API Flask của bạn có thể chặn request (Forbidden 403) do chính sách Domain Security.");
            }
        };

        // UI Helpers
        chatInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        chatInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // --- Chatbot Logic (Free Hugging Face API) ---
        async function sendMessage() {
            const val = chatInput.value.trim();
            if (!val) return;

            addMessage('user', val);
            chatInput.value = '';
            chatInput.style.height = 'auto';

            showTyping();

            try {
                // Sử dụng HF Inference API (Serverless Free Tier)
                const response = await fetch(`https://api-inference.huggingface.co/models/${HF_MODEL}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(HF_TOKEN ? { 'Authorization': `Bearer ${HF_TOKEN}` } : {})
                    },
                    body: JSON.stringify({
                        inputs: `[INST] Bạn là bác sĩ tư vấn tiểu đường. Trả lời bằng tiếng Việt ngắn gọn. Câu hỏi: ${val} [/INST]`,
                        parameters: { max_new_tokens: 250, temperature: 0.7 }
                    })
                });

                const data = await response.json();
                hideTyping();

                if (Array.isArray(data) && data[0].generated_text) {
                    const fullText = data[0].generated_text;
                    const cleanReply = fullText.split('[/INST]').pop().trim();
                    addMessage('ai', cleanReply);
                } else {
                    addMessage('ai', "Tôi đang bận xử lý dữ liệu lâm sàng. Vui lòng sử dụng các công cụ chẩn đoán bên trái để tôi có thêm cơ sở tư vấn nhé!");
                }
            } catch (err) {
                hideTyping();
                addMessage('ai', "Hmm, có vẻ như kết nối tới não bộ AI đang gặp chút gián đoạn. Bạn thử lại sau nhé.");
            }
        }

        function showTyping() {
            const div = document.createElement('div');
            div.id = 'typing-indicator';
            div.className = 'message ai';
            div.innerHTML = `<div class="avatar ai">AI</div><div class="message-content"><div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`;
            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        // --- Diagnostics Logic ---

        async function predictIris() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const errorEl = document.getElementById('img-error');
            errorEl.style.display = 'none';

            if (!file) { addMessage('ai', "Vui lòng chọn ảnh mống mắt để phân tích."); return; }

            // Backend Check: Max size 440KB & Dimensions <= 256
            if (file.size > 450000) {
                errorEl.innerText = "Lỗi: File quá lớn (>440KB). Vui lòng nén ảnh.";
                errorEl.style.display = 'block';
                return;
            }

            addMessage('user', "Đang gửi ảnh mống mắt tới server...");
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch(`${API_BASE}/predict_image`, { method: 'POST', body: formData });
                if (!res.ok) {
                    const errBody = await res.json();
                    throw new Error(errBody.error || `HTTP ${res.status}`);
                }
                const data = await res.json();
                const pred = data.disease; // 0=Normal, 1=Disease
                const resultText = pred === 1 ? "CÓ DẤU HIỆU BỆNH" : "BÌNH THƯỜNG (Sạch)";
                addMessage('ai', `Kết quả phân tích mống mắt: **${resultText}**.`);
            } catch (err) {
                addMessage('ai', "Không thể phân tích ảnh.");
                errorEl.innerText = `Lỗi kết nối: ${err.message}`;
                errorEl.style.display = 'block';
            }
        }

        async function predictDiabetes() {
            const payload = {};
            const errorEl = document.getElementById('data-error');
            errorEl.style.display = 'none';

            fields.forEach(f => {
                const v = document.getElementById(`field-${f}`).value;
                payload[f] = v === "" ? 0 : parseFloat(v);
            });

            addMessage('user', "Đang phân tích các chỉ số cơ thể...");
            try {
                const res = await fetch(`${API_BASE}/predict_data`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errBody = await res.json();
                    throw new Error(errBody.error || `HTTP ${res.status}`);
                }

                const data = await res.json();
                const pred = data.disease; // 0=Normal, 1=Disease
                const risk = pred === 1 ? "CÓ NGUY CƠ CAO (Tích cực xét nghiệm)" : "BÌNH THƯỜNG (An toàn)";
                addMessage('ai', `Dựa trên dữ liệu: **${risk}**.`);
            } catch (err) {
                addMessage('ai', "Lỗi xử lý dữ liệu.");
                errorEl.innerText = `Lỗi kết nối: ${err.message}`;
                errorEl.style.display = 'block';
            }
        }

        // Theme & Preview Utility
        function toggleTheme() {
            const b = document.body;
            b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            document.querySelector('.theme-toggle i').className = b.getAttribute('data-theme') === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const preview = document.getElementById('preview');
                    const label = document.getElementById('upload-label');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    label.style.display = 'none';
                    document.querySelector('.drop-zone i').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>

</html>
