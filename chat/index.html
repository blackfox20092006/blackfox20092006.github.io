<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Care AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/disable-devtool"></script>
    <style>
        :root {
            --primary-bg: #111827;
            --accent-color: #0d9488;
            --accent-hover: #14b8a6;
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --card-bg: rgba(31, 41, 55, 0.7);
            --bubble-user: #0d9488;
            --bubble-ai: #374151;
            --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 15px rgba(13, 148, 136, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-color) transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1e293b, #111827);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 98%;
            max-width: 1400px;
            height: 96vh;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        @media (max-width: 1200px) {
            .app-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }

        .app-header {
            padding: 24px 40px;
            background: rgba(13, 148, 136, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-box {
            width: 50px;
            height: 50px;
            background: var(--accent-color);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-glow);
            flex-shrink: 0;
        }

        .logo-box i {
            font-size: 1.6rem;
            color: white;
        }

        .header-text h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-text p {
            font-size: 0.9rem;
            color: var(--text-dim);
            font-weight: 400;
        }

        .chat-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .msg {
            max-width: 75%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: slideUp 0.35s ease-out forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-bubble {
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .msg.user {
            align-self: flex-end;
        }

        .msg.user .msg-bubble {
            background: var(--bubble-user);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg.ai {
            align-self: flex-start;
        }

        .msg.ai .msg-bubble {
            background: var(--bubble-ai);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .msg-time {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin: 0 5px;
        }

        .msg.user .msg-time {
            text-align: right;
        }

        .input-section {
            padding: 30px;
            background: linear-gradient(to top, rgba(17, 24, 39, 0.8), transparent);
        }

        .input-bar {
            background: rgba(55, 65, 81, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
        }

        .upload-trigger {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .upload-trigger:hover {
            background: var(--accent-color);
            transform: scale(1.05);
            box-shadow: var(--shadow-glow);
        }

        #promptInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            padding: 5px 15px;
            max-height: 120px;
            resize: none;
        }

        .send-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .send-btn:hover {
            background: var(--accent-hover);
            box-shadow: var(--shadow-glow);
        }

        .typing {
            display: flex;
            gap: 4px;
            padding-top: 5px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-dim);
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: 0;
            }

            40% {
                opacity: 1;
            }
        }

        .msg-image {
            max-width: 100%;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: #1f2937;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--accent-color);
            box-shadow: var(--shadow-soft);
        }

        .btn-modal {
            margin-top: 20px;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-box">
                <i class="fas fa-heartbeat"></i>
            </div>
            <div class="header-text">
                <h1>Diabetes Care AI</h1>
                <p>Trợ lý chăm sóc sức khỏe bệnh tiểu đường chuyên nghiệp</p>
            </div>
        </header>
        <div class="chat-area" id="chatHistory">
            <div class="msg ai">
                <div class="msg-bubble">
                    Chào bạn! Tôi là trợ lý AI chuyên về sức khỏe tiểu đường. Tôi có thể giúp bạn phân tích ảnh mống mắt
                    hoặc giải đáp các thắc mắc về bệnh tiểu đường các loại.
                </div>
                <div class="msg-time">Vừa xong</div>
            </div>
        </div>
        <div class="input-section">
            <div class="input-bar">
                <button class="upload-trigger" title="Tải ảnh mống mắt"
                    onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-plus"></i>
                </button>
                <textarea id="promptInput" rows="1" placeholder="Nhập câu hỏi tại đây..."></textarea>
                <button id="sendBtn" class="send-btn" onclick="handleTextChat()">
                    <span>Gửi</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
    <input type="file" id="fileInput" hidden accept="image/*">
    <canvas id="resizeCanvas" width="256" height="256" style="display:none;"></canvas>
    <div id="modal-overlay">
        <div class="modal">
            <h3 id="modalTitle">Thông báo</h3>
            <p id="modalBody">...</p>
            <button class="btn-modal" onclick="document.getElementById('modal-overlay').style.display='none'">Đã
                hiểu</button>
        </div>
    </div>
    <script>
        DisableDevtool({ ondevtoolopen: () => { window.location.href = "about:blank"; } });
        const API_BASE = "https://d4df-109-237-69-254.ngrok-free.app";
        const ui = {
            history: document.getElementById('chatHistory'),
            prompt: document.getElementById('promptInput'),
            fileIn: document.getElementById('fileInput'),
            canvas: document.getElementById('resizeCanvas')
        };
        ui.fileIn.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showModal("Lỗi file", "Vui lòng chỉ tải lên tệp hình ảnh.");
                ui.fileIn.value = '';
                return;
            }
            try {
                const blob = await resizeImage(file);
                addMessage('user', `<img src="${URL.createObjectURL(blob)}" class="msg-image"><br>[Đã gửi ảnh chẩn đoán]`);
                await performIrisPrediction(blob);
                ui.fileIn.value = '';
            } catch (err) {
                addMessage('ai', "Lỗi: Không thể xử lý hình ảnh này.");
            }
        };
        async function resizeImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const ctx = ui.canvas.getContext('2d');
                    ctx.fillStyle = "black";
                    ctx.fillRect(0, 0, 256, 256);
                    ctx.drawImage(img, 0, 0, 256, 256);
                    ui.canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.9);
                };
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }
        async function performIrisPrediction(blob) {
            const typingId = 'typing-' + Date.now();
            addTypingIndicator(typingId);
            const fd = new FormData();
            fd.append('file', blob, 'prediction_256.jpg');
            try {
                const res = await fetch(`${API_BASE}/predict_image`, {
                    method: 'POST',
                    body: fd,
                    headers: { 'Accept': 'application/json' }
                });
                const data = await res.json();
                removeTypingIndicator(typingId);
                if (data.pic) {
                    const heatmap = `<img src="data:image/jpeg;base64,${data.pic}" class="msg-image">`;
                    addMessage('ai', `${heatmap}<br>${data.cmt || "Kết quả đã được xử lý."}`);
                } else {
                    addMessage('ai', data.cmt || "Không nhận được phản hồi chẩn đoán.");
                }
            } catch (err) {
                removeTypingIndicator(typingId);
                addMessage('ai', "Lỗi kết nối tới máy chủ AI.");
            }
        }
        async function handleTextChat() {
            const text = ui.prompt.value.trim();
            if (!text) return;
            addMessage('user', text);
            ui.prompt.value = '';
            ui.prompt.style.height = 'auto';
            const typingId = 'typing-' + Date.now();
            addTypingIndicator(typingId);
            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await res.json();
                removeTypingIndicator(typingId);
                addMessage('ai', data.response || "Rất tiếc, tôi chưa hiểu ý bạn.");
            } catch (err) {
                removeTypingIndicator(typingId);
                addMessage('ai', "Lỗi kết nối chatbot.");
            }
        }
        ui.prompt.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleTextChat();
            }
        });
        function addMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${role}`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            msgDiv.innerHTML = `<div class="msg-bubble">${content}</div><div class="msg-time">${time}</div>`;
            ui.history.appendChild(msgDiv);
            ui.history.scrollTop = ui.history.scrollHeight;
        }
        function addTypingIndicator(id) {
            const div = document.createElement('div');
            div.className = 'msg ai';
            div.id = id;
            div.innerHTML = `<div class="msg-bubble"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
            ui.history.appendChild(div);
            ui.history.scrollTop = ui.history.scrollHeight;
        }
        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
        function showModal(title, body) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = body;
            document.getElementById('modal-overlay').style.display = 'flex';
        }
        ui.prompt.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
</body>

</html>
